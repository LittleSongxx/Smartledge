# Smartledge 站点（nginx）。放到 /etc/nginx/sites-available/smartledge.conf 并软链到 sites-enabled。
#
# 结构：静态前端（Vue 构建产物）+ 反向代理到本机 9083 的 Java 服务。
#   /            -> /srv/smartledge/release/web（SPA，history 模式回退 index.html）
#   /api 等      -> 127.0.0.1:9083
#   smartlect.cn -> 301 到 smartledge.cn（防拼写丢失流量）
#
# HTTPS 证书由 certbot 以 webroot 方式签发（见 deploy/server/README.md），
# 证书路径为 /etc/letsencrypt/live/smartledge.cn/。

# ---- 限流 ----------------------------------------------------------------
# 对话接口：按 IP 限制建连与请求速率，避免公开演示被刷消耗模型额度。
limit_req_zone $binary_remote_addr zone=smartledge_chat:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=smartledge_api:10m rate=300r/m;
limit_conn_zone $binary_remote_addr zone=smartledge_conn:10m;

upstream smartledge_backend {
    server 127.0.0.1:9083;
    keepalive 16;
}

# ---- HTTP：ACME 校验 + 跳转 HTTPS ---------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name smartledge.cn www.smartledge.cn smartlect.cn www.smartlect.cn;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://smartledge.cn$request_uri;
    }
}

# ---- smartlect.cn：301 到主域名 ------------------------------------------
server {
    # nginx 1.24 用 listen 参数启用 HTTP/2；1.25+ 也兼容该写法（仅提示弃用）。
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name smartlect.cn www.smartlect.cn;

    ssl_certificate     /etc/letsencrypt/live/smartledge.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/smartledge.cn/privkey.pem;
    # TLS 参数直接写在站点配置里，不依赖 certbot nginx 插件生成的文件
    # （本机用 certonly --webroot 签发的证书，不会生成 options-ssl-nginx.conf）。
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    return 301 https://smartledge.cn$request_uri;
}

# ---- 主站 ---------------------------------------------------------------
server {
    # nginx 1.24 用 listen 参数启用 HTTP/2；1.25+ 也兼容该写法（仅提示弃用）。
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name smartledge.cn www.smartledge.cn;

    ssl_certificate     /etc/letsencrypt/live/smartledge.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/smartledge.cn/privkey.pem;
    # TLS 参数直接写在站点配置里，不依赖 certbot nginx 插件生成的文件
    # （本机用 certonly --webroot 签发的证书，不会生成 options-ssl-nginx.conf）。
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /srv/smartledge/release/web;
    index index.html;
    server_tokens off;

    client_max_body_size 200m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 前端入口页不缓存，避免发版后仍拿到旧 index.html 引用已删除的哈希资源。
    location = /index.html {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # Vite 产物带内容哈希，可长期缓存。
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA 路由回退：/admin/... 等前端路由直接访问时仍返回 index.html。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- 对话接口：SSE 流式，关闭缓冲并按 IP 限速 ----
    location = /api/chat/stream {
        limit_req zone=smartledge_chat burst=5 nodelay;
        limit_conn smartledge_conn 8;

        proxy_pass http://smartledge_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # SSE 必须禁用一切缓冲，否则事件会攒到流结束才下发。
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    # ---- 其余接口 ----
    # 注意：只代理后端真实存在的前缀。前端自己的路由是 /admin/**（如 /admin/dashboard），
    # 它们必须落到 SPA；后端只占用 /admin/auth，两者不能一起匹配，
    # 否则刷新管理台页面会打到后端拿到 401。
    location ~ ^/(api|manage)(/|$) {
        limit_req zone=smartledge_api burst=60 nodelay;

        proxy_pass http://smartledge_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
    }

    # ---- 管理端认证接口 ----
    location ^~ /admin/auth {
        limit_req zone=smartledge_api burst=60 nodelay;

        proxy_pass http://smartledge_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
    }

    # ---- 接口文档（Knife4j），公开演示时便于查看契约 ----
    location ~ ^/(doc\.html|webjars|v3/api-docs|swagger-resources|actuator/health) {
        proxy_pass http://smartledge_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
